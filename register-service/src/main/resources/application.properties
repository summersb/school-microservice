quarkus.application.name=register-service

quarkus.http.port=8080
%dev.quarkus.http.port=8086
%test.quarkus.http.port=8096

mp.jwt.verify.issuer=school-auth-service
mp.jwt.verify.publickey.algorithm=HS256
mp.jwt.verify.publickey={"kty":"oct","k":"${JWT_SECRET:ZGV2LW9ubHktc2hhcmVkLXNlY3JldC1jaGFuZ2UtbWUtcGxlYXNlLTAxMjM0NTY3ODk}","alg":"HS256"}
quarkus.smallrye-jwt.enabled=true

app.internal.token=${INTERNAL_API_TOKEN:dev-only-internal-token-change-me}

# Datasource for the idempotency_key table only (see IdempotencyKeyStore) --
# this service still maps no business entities. Same pattern as the other five
# services: no jdbc-url/username/password here, so in Docker it comes from the
# QUARKUS_DATASOURCE_* env vars pointing at the shared school_db (see
# docker-compose.yml), and in dev/test Quarkus Dev Services starts an ephemeral
# Postgres automatically.
quarkus.datasource.db-kind=postgresql

# The prod stack's db-migrate job is the only thing that ever runs Flyway
# against the real school_db (see V1__init.sql); this service never migrates
# it. Dev Services databases have nothing else to build their schema, so
# Flyway stays on there.
quarkus.flyway.migrate-at-start=false
%dev.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.migrate-at-start=true

quarkus.rest-client.student-api.url=http://localhost:8082
%prod.quarkus.rest-client.student-api.url=http://student-service:8080
quarkus.rest-client.student-api.scope=jakarta.enterprise.context.ApplicationScoped

quarkus.rest-client.classes-api.url=http://localhost:8084
%prod.quarkus.rest-client.classes-api.url=http://classes-service:8080
quarkus.rest-client.classes-api.scope=jakarta.enterprise.context.ApplicationScoped

quarkus.rest-client.schedule-api.url=http://localhost:8085
%prod.quarkus.rest-client.schedule-api.url=http://schedule-service:8080
quarkus.rest-client.schedule-api.scope=jakarta.enterprise.context.ApplicationScoped

quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
