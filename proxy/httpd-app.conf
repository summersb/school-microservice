# Serves the built React app at /ui (with SPA fallback so client-side routes
# like /ui/classes work on a hard refresh) and reverse-proxies each
# /<name>-api/ prefix to the matching backend microservice's container.

Alias /ui /usr/local/apache2/htdocs/ui

<Directory "/usr/local/apache2/htdocs/ui">
    Options -Indexes
    AllowOverride None
    Require all granted

    RewriteEngine On
    RewriteBase /ui
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]
    RewriteRule ^ index.html [L]
</Directory>

RewriteEngine On
RewriteRule ^/$ /ui/ [R,L]

ProxyPreserveHost On
ProxyRequests Off

# disablereuse=On on every ProxyPass below is not optional here. All six
# backends are Quarkus on port 8080 and, with ProxyPreserveHost On, every one of
# them sees the same `Host: localhost:8080`. Under concurrent load Apache could
# then hand a request to a pooled keep-alive connection belonging to a different
# service -- /student-api/... answered by auth-service, and so on. The symptom is
# an intermittent 404 (the path exists on the intended service but not on the one
# that actually answered), which showed up as flaky integration tests.

ProxyPass        /auth-api/ http://auth-service:8080/ disablereuse=On
ProxyPassReverse /auth-api/ http://auth-service:8080/

ProxyPass        /student-api/ http://student-service:8080/ disablereuse=On
ProxyPassReverse /student-api/ http://student-service:8080/

ProxyPass        /faculty-api/ http://faculty-service:8080/ disablereuse=On
ProxyPassReverse /faculty-api/ http://faculty-service:8080/

ProxyPass        /classes-api/ http://classes-service:8080/ disablereuse=On
ProxyPassReverse /classes-api/ http://classes-service:8080/

ProxyPass        /schedule-api/ http://schedule-service:8080/ disablereuse=On
ProxyPassReverse /schedule-api/ http://schedule-service:8080/

ProxyPass        /register-api/ http://register-service:8080/ disablereuse=On
ProxyPassReverse /register-api/ http://register-service:8080/
