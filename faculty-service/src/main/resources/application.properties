quarkus.application.name=faculty-service

# HTTP port: 8080 inside Docker (all services use the same internal port,
# distinguished by container/hostname). For local `quarkus:dev` runs outside
# Docker, each service gets its own port so several can run at once.
quarkus.http.port=8080
%dev.quarkus.http.port=8083
%test.quarkus.http.port=8093

# Datasource: no jdbc-url/username/password is set here on purpose.
#  - In Docker (the docker-compose stack), these are supplied via QUARKUS_DATASOURCE_*
#    env vars pointing at the single shared school_db database (see docker-compose.yml).
#    Every data-owning service connects to that same database with the same credentials,
#    which is what lets its tables carry foreign keys to the other services' tables.
#    Quarkus maps those env vars onto these properties automatically at runtime.
#  - In dev mode (`mvn quarkus:dev`) and in tests (`mvn test`), Quarkus Dev Services
#    automatically starts an ephemeral Postgres container via Testcontainers (requires
#    Docker to be running locally), applies the Flyway migrations against it, and tears
#    it down afterwards -- so both work without docker-compose running.
quarkus.datasource.db-kind=postgresql

# This service never migrates the shared school_db. In the docker-compose stack
# (which runs the prod profile) the one-shot `db-migrate` job applies
# /db/migration before any service is allowed to start, so Flyway is off here --
# no start-up race, and no risk of two service versions carrying different
# migration sets during a rolling deploy.
#
# Dev mode and tests are a different database entirely: Quarkus Dev Services
# starts a throwaway Postgres per service and nothing else is around to create
# the schema in it, so Flyway still runs there, against the same migrations
# copied onto the classpath at build time (see the parent pom).
quarkus.flyway.migrate-at-start=false
%dev.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.migrate-at-start=true

quarkus.hibernate-orm.database.generation=validate

# JWT verification - shared HS256 secret injected via env var JWT_SECRET,
# which holds the base64url-encoded key bytes and is inlined below as an
# "oct" JWK (SmallRye requires JWK form for symmetric keys).
# Auth service signs with this same secret (see auth-service application.properties).
mp.jwt.verify.issuer=school-auth-service
mp.jwt.verify.publickey.algorithm=HS256
mp.jwt.verify.publickey={"kty":"oct","k":"${JWT_SECRET:ZGV2LW9ubHktc2hhcmVkLXNlY3JldC1jaGFuZ2UtbWUtcGxlYXNlLTAxMjM0NTY3ODk}","alg":"HS256"}
quarkus.smallrye-jwt.enabled=true

quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# Sensible CORS defaults so the frontend (served from the Apache proxy) can call this
# service directly in local dev without Docker if needed.
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
